[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riemann-spectra"
version = "0.1.0"
description = "Investigação matemática e computacional de espectroscopia inversa dos zeros da função zeta de Riemann"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Riemann Spectra Research Team" }
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "mpmath>=1.3.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
riemann-spectra = "riemann_spectra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "independent/tests"]
norecursedirs = ["archive", "results", ".venv", "data"]
